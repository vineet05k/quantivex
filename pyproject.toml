[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantivex"
version = "1.3.0"
description = "Process IBM quantum-processor calibration and job files into checked, noise-aware simulation and hardware results, with an LLM-written report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Quantivex contributors" }]
keywords = ["quantum computing", "quantum chemistry", "VQE", "LLM agent", "qiskit", "noise-aware compilation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17",
  "matplotlib>=3.8",
  "openai>=1.55",
  "jsonschema>=4.23",
  # PySCF has no Windows wheels. Bundled integrals cover the standard geometries,
  # so Windows works without it; Linux/macOS get it for off-grid geometries.
  "pyscf>=2.6; platform_system != 'Windows'",
]

[project.optional-dependencies]
gui = ["streamlit>=1.45"]
gui-auth = ["streamlit[auth]>=1.45"]
ibm = ["qiskit-ibm-runtime>=0.50,<0.51"]
anthropic = ["anthropic>=0.49"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "qiskit-ibm-runtime>=0.50,<0.51", "streamlit>=1.45", "anthropic>=0.49"]

[project.scripts]
quantivex = "quantivex.cli:main"
quantivex-gui = "quantivex.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantivex = ["resources/*.json.gz", "resources/*.json", "resources/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: noisy simulations over many layouts (deselect with -m 'not slow')",
  "pyscf: needs PySCF (skipped automatically when it is not installed)",
]
filterwarnings = [
  "ignore::DeprecationWarning:pyscf.*",
  "ignore::scipy.sparse.SparseEfficiencyWarning",
]

[tool.coverage.run]
source = ["quantivex"]
omit = ["*/app.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and angstrom signs are intentional

[tool.mypy]
python_version = "3.10"
packages = ["quantivex"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
